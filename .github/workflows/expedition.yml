name: Expedition proof

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "candidates/**"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: expedition-verifier
  cancel-in-progress: false

jobs:
  verify:
    name: Trusted expedition verifier
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out protected verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Build protected verifier sandbox
        run: docker build --file Dockerfile.verifier --tag alter-everest-verifier .

      - name: Admit one declarative candidate
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/admit-candidate-pr.mjs
          --event "$GITHUB_EVENT_PATH"
          --out "$RUNNER_TEMP/candidate.json"

      - name: Replay candidate in a bounded offline sandbox
        env:
          CANDIDATE: ${{ steps.admission.outputs.candidate_file }}
          EXPECTED_AGENT: ${{ steps.admission.outputs.actor }}
        run: |
          timeout --signal=KILL 4s docker run --rm \
            --network none \
            --memory 256m \
            --cpus 1 \
            --pids-limit 128 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --volume "$CANDIDATE:/input/candidate.json:ro" \
            alter-everest-verifier \
            /input/candidate.json \
            --expected-agent "$EXPECTED_AGENT"

  dispatch:
    name: Queue canonical reducer
    needs: verify
    if: vars.REDUCER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mint short-lived reducer token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.REDUCER_APP_ID }}
          private-key: ${{ secrets.REDUCER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Queue serialized canonical replay
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n \
            --argjson pull_number "$PULL_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            '{event_type:"accepted-expedition",client_payload:{pull_number:$pull_number,head_sha:$head_sha,source_workflow:"expedition-v1"}}' \
            | gh api "repos/$GITHUB_REPOSITORY/dispatches" --input -
