name: Canonical world reducer

on:
  repository_dispatch:
    types: [accepted-expedition]

permissions:
  contents: read
  discussions: write
  pull-requests: read

concurrency:
  group: canonical-world-pipeline
  queue: max
  cancel-in-progress: false

jobs:
  reduce:
    name: Replay, sign, and append
    if: github.event.client_payload.source_workflow == 'expedition-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out protected canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Install the minimal protected expedition runtime
        run: >-
          npm ci
          --ignore-scripts
          --no-audit
          --no-fund
          --prefix ci/expedition-runtime

      - name: Install the optional protected R2 publisher
        if: vars.R2_PUBLISH_ENABLED == 'true'
        run: npm ci --ignore-scripts

      - name: Re-admit exact verified pull-request head
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head_sha }}
        run: >-
          node scripts/admit-candidate-pr.mjs
          --event "$GITHUB_EVENT_PATH"
          --expected-head "$EXPECTED_HEAD"
          --allow-applied
          --out "$RUNNER_TEMP/candidate.json"

      - name: Replay against current world and append signed artifacts
        env:
          CANDIDATE: ${{ steps.admission.outputs.candidate_file }}
          EXPECTED_AGENT: ${{ steps.admission.outputs.actor }}
          VERIFIER_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.VERIFIER_PRIVATE_KEY_PKCS8_BASE64 }}
        run: >-
          node
          --import ./ci/expedition-runtime/node_modules/tsx/dist/loader.mjs
          scripts/reduce-expedition.ts
          "$CANDIDATE"
          --expected-agent "$EXPECTED_AGENT"
          --require-signature

      - name: Build the public read model
        run: >-
          node
          --import ./ci/expedition-runtime/node_modules/tsx/dist/loader.mjs
          scripts/build-world-feed.ts

      - name: Prepare an exact R2 publish manifest
        if: vars.R2_PUBLISH_ENABLED == 'true'
        env:
          CANDIDATE_HASH: ${{ steps.admission.outputs.candidate_hash }}
        run: >-
          node scripts/build-r2-publish-manifest.mjs
          --candidate-hash "$CANDIDATE_HASH"
          --out "$RUNNER_TEMP/r2-publish-manifest.json"

      - name: Mint short-lived reducer token after replay
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.REDUCER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REDUCER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Commit canonical artifacts
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_NUMBER: ${{ steps.admission.outputs.pull_number }}
        run: |
          git config user.name "Alter Everest Reducer"
          git config user.email "reducer@users.noreply.github.com"
          git add \
            world/snapshot.json world/events world/receipts world/proofs \
            public/data/world/latest.json public/data/world/badges.json \
            public/data/world/tiles
          if git diff --cached --quiet; then
            echo "Candidate was already reduced."
          else
            git commit -m "world: accept expedition #${PULL_NUMBER}"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Record an optional Community Build contribution
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_HASH: ${{ steps.admission.outputs.candidate_hash }}
          PULL_NUMBER: ${{ steps.admission.outputs.pull_number }}
        run: >-
          node scripts/record-build-contribution.mjs
          --pull "$PULL_NUMBER"
          --candidate-hash "$CANDIDATE_HASH"

      - name: Publish immutable artifacts and pointers to R2 when enabled
        if: vars.R2_PUBLISH_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORLD_BUCKET: ${{ vars.WORLD_BUCKET }}
        run: >-
          node scripts/publish-world-r2.mjs
          --manifest "$RUNNER_TEMP/r2-publish-manifest.json"

      - name: Report acceptance and close candidate pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_NUMBER: ${{ steps.admission.outputs.pull_number }}
        run: |
          gh pr comment "$PULL_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none \
            --body "Accepted by the canonical reducer. The signed receipt, replay proof, and new world event are now on the protected branch. This expedition PR is intentionally closed unmerged; no human review or merge is required."
          if [ "$(gh pr view "$PULL_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "OPEN" ]; then
            gh pr close "$PULL_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
