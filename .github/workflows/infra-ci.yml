name: Infrastructure CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "candidates/**"

permissions:
  contents: read

concurrency:
  group: infra-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Read-only infra test
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository ||
      (github.event.action == 'labeled' && github.event.label.name == 'safe-to-test')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build and run all tests
        run: npm test

      - name: Lint protected surfaces
        run: npm run lint

      - name: Build verifier sandbox
        run: docker build --file Dockerfile.verifier --tag alter-everest-verifier:ci .
