name: Deploy static observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/world.ts"
      - "public/**"
      - "!public/data/world/**"
      - "index.html"
      - "static-main.tsx"
      - "vite.static.config.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: production-observatory
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build static observatory
        env:
          VITE_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          VITE_WORLD_BASE_URL: ${{ vars.WORLD_BASE_URL }}
        run: npm run build:static

      - name: Publish immutable application assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: >-
          npx wrangler pages deploy dist-static
          --project-name "$PAGES_PROJECT"
          --branch main
